<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>עדכונים</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      color: #222;
    }

    header {
      background: #172033;
      color: white;
      padding: 20px;
      text-align: center;
    }

    main {
      max-width: 900px;
      margin: 30px auto;
      padding: 15px;
    }

    .card {
      background: white;
      padding: 25px;
      margin-bottom: 20px;
      border-radius: 12px;
      box-shadow: 0 3px 12px #0001;
    }

    input,
    textarea {
      width: 100%;
      padding: 12px;
      margin: 8px 0;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
    }

    textarea {
      min-height: 130px;
      resize: vertical;
    }

    button {
      border: 0;
      border-radius: 8px;
      padding: 12px 20px;
      margin: 5px;
      cursor: pointer;
      background: #172033;
      color: white;
      font-size: 16px;
    }

    button:hover {
      opacity: .9;
    }

    .danger {
      background: #b42318;
    }

    .success {
      background: #16803c;
    }

    .hidden {
      display: none !important;
    }

    .news-item {
      border-bottom: 1px solid #ddd;
      padding: 20px 0;
    }

    .news-item:last-child {
      border-bottom: 0;
    }

    .date {
      color: #777;
      font-size: 14px;
      margin-bottom: 8px;
    }

    #message {
      padding: 12px;
      margin: 10px 0;
      border-radius: 8px;
      background: #eef2ff;
    }
  </style>
</head>

<body>

<header>
  <h1>📰 מערכת עדכונים</h1>
  <p>מערכת פרטית למשתמשים מאושרים</p>
</header>

<main>

  <!-- הודעות מערכת -->
  <div id="message" class="hidden"></div>

  <!-- התחברות -->
  <section id="loginBox" class="card">
    <h2>כניסה</h2>

    <input
      id="loginEmail"
      type="email"
      placeholder="כתובת אימייל"
    >

    <input
      id="loginPassword"
      type="password"
      placeholder="סיסמה"
    >

    <button onclick="login()">כניסה</button>
    <button onclick="showRegister()">הרשמה</button>
  </section>


  <!-- הרשמה -->
  <section id="registerBox" class="card hidden">
    <h2>הרשמה</h2>

    <input
      id="registerEmail"
      type="email"
      placeholder="כתובת אימייל"
    >

    <input
      id="registerPassword"
      type="password"
      placeholder="סיסמה"
    >

    <button onclick="register()">שליחת הרשמה</button>
    <button onclick="showLogin()">חזרה לכניסה</button>
  </section>


  <!-- אזור המשתמש -->
  <section id="userArea" class="hidden">

    <div class="card">
      <h2>ברוך הבא 👋</h2>
      <p id="userEmail"></p>

      <button onclick="logout()" class="danger">
        יציאה
      </button>
    </div>

    <div class="card">
      <h2>📰 עדכונים</h2>

      <div id="newsList">
        טוען עדכונים...
      </div>
    </div>

  </section>


  <!-- אזור מנהל -->
  <section id="adminArea" class="hidden">

    <div class="card">
      <h2>👑 אזור מנהל</h2>

      <h3>פרסום עדכון חדש</h3>

      <input
        id="newsTitle"
        type="text"
        placeholder="כותרת"
      >

      <textarea
        id="newsContent"
        placeholder="תוכן העדכון"
      ></textarea>

      <button onclick="publishNews()" class="success">
        פרסום עדכון
      </button>
    </div>


    <div class="card">
      <h2>👥 משתמשים ממתינים</h2>

      <div id="pendingUsers">
        טוען...
      </div>
    </div>

  </section>

</main>


<script>
  // ============================================
  // חיבור ל-Supabase
  // ============================================

  const SUPABASE_URL =
    "https://bohkrwriduixnqelggmd.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable_pM2ygANqmEkBNEiCSsOElg_V4KfWLQv";

  const supabaseClient =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );


  // ============================================
  // כלי עזר
  // ============================================

  function showMessage(text) {
    const box = document.getElementById("message");

    box.textContent = text;
    box.classList.remove("hidden");

    setTimeout(() => {
      box.classList.add("hidden");
    }, 5000);
  }


  function showLogin() {
    document.getElementById("loginBox")
      .classList.remove("hidden");

    document.getElementById("registerBox")
      .classList.add("hidden");
  }


  function showRegister() {
    document.getElementById("loginBox")
      .classList.add("hidden");

    document.getElementById("registerBox")
      .classList.remove("hidden");
  }


  // ============================================
  // הרשמה
  // ============================================

  async function register() {

    const email =
      document.getElementById("registerEmail")
        .value.trim();

    const password =
      document.getElementById("registerPassword")
        .value;

    if (!email || !password) {
      showMessage("נא למלא אימייל וסיסמה");
      return;
    }

    if (password.length < 6) {
      showMessage("הסיסמה צריכה להכיל לפחות 6 תווים");
      return;
    }

    const { data, error } =
      await supabaseClient.auth.signUp({
        email: email,
        password: password
      });

    if (error) {
      showMessage(error.message);
      return;
    }

    showMessage(
      "ההרשמה התקבלה. לאחר אישור המנהל תוכל להיכנס למערכת."
    );

    showLogin();
  }


  // ============================================
  // התחברות
  // ============================================

  async function login() {

    const email =
      document.getElementById("loginEmail")
        .value.trim();

    const password =
      document.getElementById("loginPassword")
        .value;

    if (!email || !password) {
      showMessage("נא למלא אימייל וסיסמה");
      return;
    }

    const { data, error } =
      await supabaseClient.auth.signInWithPassword({
        email: email,
        password: password
      });

    if (error) {
      showMessage("פרטי ההתחברות אינם נכונים");
      return;
    }

    await loadUser();
  }


  // ============================================
  // טעינת המשתמש
  // ============================================

  async function loadUser() {

    const {
      data: { user }
    } = await supabaseClient.auth.getUser();

    if (!user) {
      return;
    }

    const { data: profile, error } =
      await supabaseClient
        .from("profiles")
        .select("*")
        .eq("id", user.id)
        .single();

    if (error || !profile) {
      showMessage("הפרופיל עדיין לא נוצר במערכת");
      return;
    }

    document.getElementById("loginBox")
      .classList.add("hidden");

    document.getElementById("registerBox")
      .classList.add("hidden");

    document.getElementById("userArea")
      .classList.remove("hidden");

    document.getElementById("userEmail")
      .textContent = user.email;


    // המשתמש עדיין לא אושר
    if (!profile.approved) {

      document.getElementById("newsList")
        .innerHTML =
        "<p>⏳ ההרשמה שלך ממתינה לאישור המנהל.</p>";

      return;
    }


    // משתמש מאושר
    await loadNews();


    // מנהל
    if (profile.is_admin === true) {

      document.getElementById("adminArea")
        .classList.remove("hidden");

      await loadPendingUsers();
    }
  }


  // ============================================
  // טעינת עדכונים
  // ============================================

  async function loadNews() {

    const { data, error } =
      await supabaseClient
        .from("news")
        .select("*")
        .order("created_at", {
          ascending: false
        });

    const list =
      document.getElementById("newsList");

    if (error) {
      list.innerHTML =
        "<p>לא ניתן לטעון את העדכונים.</p>";

      return;
    }

    if (!data || data.length === 0) {
      list.innerHTML =
        "<p>אין עדיין עדכונים.</p>";

      return;
    }

    list.innerHTML = "";

    data.forEach(item => {

      const div =
        document.createElement("div");

      div.className = "news-item";

      const title =
        document.createElement("h3");

      title.textContent = item.title;


      const content =
        document.createElement("p");

      content.textContent = item.content;


      const date =
        document.createElement("div");

      date.className = "date";

      date.textContent =
        new Date(item.created_at)
          .toLocaleString("he-IL");


      div.appendChild(title);
      div.appendChild(date);
      div.appendChild(content);

      list.appendChild(div);
    });
  }


  // ============================================
  // פרסום עדכון
  // ============================================

  async function publishNews() {

    const title =
      document.getElementById("newsTitle")
        .value.trim();

    const content =
      document.getElementById("newsContent")
        .value.trim();


    if (!title || !content) {
      showMessage("נא למלא כותרת ותוכן");
      return;
    }


    const {
      data: { user }
    } = await supabaseClient.auth.getUser();


    if (!user) {
      showMessage("יש להתחבר למערכת");
      return;
    }


    const { error } =
      await supabaseClient
        .from("news")
        .insert({
          title: title,
          content: content,
          created_by: user.id
        });


    if (error) {
      showMessage(
        "לא ניתן לפרסם: " + error.message
      );

      return;
    }


    document.getElementById("newsTitle")
      .value = "";

    document.getElementById("newsContent")
      .value = "";


    showMessage("העדכון פורסם בהצלחה");

    await loadNews();
  }


  // ============================================
  // משתמשים ממתינים
  // ============================================

  async function loadPendingUsers() {

    const box =
      document.getElementById("pendingUsers");


    const { data, error } =
      await supabaseClient
        .from("profiles")
        .select("*")
        .eq("approved", false)
        .order("created_at", {
          ascending: true
        });


    if (error) {

      box.innerHTML =
        "<p>לא ניתן לטעון משתמשים.</p>";

      return;
    }


    if (!data || data.length === 0) {

      box.innerHTML =
        "<p>אין משתמשים שממתינים לאישור.</p>";

      return;
    }


    box.innerHTML = "";


    data.forEach(user => {

      const div =
        document.createElement("div");

      div.style.borderBottom =
        "1px solid #ddd";

      div.style.padding =
        "15px 0";


      const email =
        document.createElement("strong");

      email.textContent =
        user.email;


      const approveButton =
        document.createElement("button");

      approveButton.textContent =
        "אישור משתמש";

      approveButton.className =
        "success";


      approveButton.onclick =
        () => approveUser(user.id);


      div.appendChild(email);
      div.appendChild(
        document.createElement("br")
      );

      div.appendChild(approveButton);

      box.appendChild(div);
    });
  }


  // ============================================
  // אישור משתמש
  // ============================================

  async function approveUser(userId) {

    const { error } =
      await supabaseClient
        .from("profiles")
        .update({
          approved: true
        })
        .eq("id", userId);


    if (error) {

      showMessage(
        "לא ניתן לאשר את המשתמש: " +
        error.message
      );

      return;
    }


    showMessage("המשתמש אושר בהצלחה");

    await loadPendingUsers();
  }


  // ============================================
  // יציאה
  // ============================================

  async function logout() {

    await supabaseClient.auth.signOut();

    document.getElementById("userArea")
      .classList.add("hidden");

    document.getElementById("adminArea")
      .classList.add("hidden");

    showLogin();
  }


  // ============================================
  // בדיקה אוטומטית בעת טעינת האתר
  // ============================================

  async function init() {

    const {
      data: { session }
    } = await supabaseClient.auth.getSession();


    if (session) {
      await loadUser();
    }
  }


  supabaseClient.auth.onAuthStateChange(
    async (event, session) => {

      if (event === "SIGNED_IN") {
        await loadUser();
      }

    }
  );


  init();

</script>

</body>
</html>
